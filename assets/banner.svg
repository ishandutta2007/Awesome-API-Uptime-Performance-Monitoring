<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .ping-circle {
      animation: ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: center;
    }
    .pulse-path {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: dash 4s linear infinite;
    }
    .floating-orb {
      animation: float 6s ease-in-out infinite alternate;
    }
    .status-dot {
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes dash {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ripple {
      0% { r: 4px; opacity: 1; }
      100% { r: 35px; opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-15px) translateX(10px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <g class="floating-orb" opacity="0.35">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="300" r="160" fill="#818cf8" filter="url(#glow)" />
    <circle cx="600" cy="380" r="120" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Heartbeat / Uptime Pulse Wave in Background -->
  <g opacity="0.4" transform="translate(0, 70)">
    <path class="pulse-path" d="M 0,220 L 250,220 L 280,180 L 310,250 L 340,150 L 370,270 L 400,220 L 700,220 L 730,170 L 760,260 L 790,200 L 820,220 L 1200,220" 
          fill="none" stroke="url(#pulseLineGrad)" stroke-width="3" filter="url(#softGlow)" />
  </g>

  <!-- Animated Live Status Indicator Pill (Background/Midground) -->
  <g transform="translate(490, 48)">
    <rect width="220" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <circle cx="24" cy="18" r="6" fill="#10b981" class="status-dot" />
    <circle cx="24" cy="18" r="6" fill="#10b981" class="ping-circle" stroke="#10b981" stroke-width="1.5" />
    <text x="42" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">99.99% SYSTEM OPERATIONAL</text>
  </g>

  <!-- Foreground Title and Taglines (Clear, Crisp, Unobstructed) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Main Title -->
    <text y="0" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome API Uptime &amp; Performance Monitoring
    </text>

    <!-- Subtitle -->
    <text y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      A Curated Guide to Open-Source Watchdogs, Synthetic Checks &amp; Enterprise APM
    </text>
  </g>

  <!-- Foreground Feature Badges / Highlights -->
  <g transform="translate(240, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="80" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ Synthetic Checks</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(185, 0)">
      <rect width="160" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="80" y="26" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📡 Global Latency</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(370, 0)">
      <rect width="160" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="80" y="26" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🛡️ SLA &amp; Incident Alert</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(555, 0)">
      <rect width="165" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="82" y="26" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📈 APM &amp; Observability</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#primaryGrad)" />
</svg>
